name: Publish Cydia source

on:
  push:
    branches: [main]
    paths:
      - 'repo/**'
      - 'index.html'
      - '.nojekyll'
      - 'scripts/cydia-index.py'
      - 'scripts/publish-cydia.py'
      - 'tests/cydia-repo.py'
      - '.github/workflows/cydia-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Cydia indexes and release package
        run: |
          python3 scripts/cydia-index.py repo --check
          python3 tests/cydia-repo.py
      - name: Prepare source files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R repo _site/repo
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload source
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy source
        id: deployment
        uses: actions/deploy-pages@v5
